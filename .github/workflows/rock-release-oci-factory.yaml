name: Open a PR to OCI Factory when a new rock is merged to main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ (inputs.rock-path && inputs.rock-path != '.') && format('-{0}', inputs.rock-path) || '' }}
  cancel-in-progress: true

on:
  workflow_call:
    inputs:
      rock-path:
        description: "Path to the rock(s) directory to operate in (defaults to 'rock')"
        required: false
        default: "."
        type: string
      rock-support:
        description: "Which level of semantic version to support in the OCI Factory ('patch', 'minor', 'major')"
        required: false
        default: "minor"
        type: string
      risk-track:
        description: "Risk track on which to release the rock"
        required: false
        default: "stable"
        type: string
      
    secrets:
      OBSERVABILITY_NOCTUA_TOKEN:
        required: true

jobs:
  release-oci-factory:
    name: Add the new rock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the rock repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Needed to check modified files
      - name: Find changes inside version folders
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          path: ${{ inputs.rock-path }}
          # Any file changed inside a version folder (e.g. 0.130/rockcraft.yaml,
          # 0.130/manifest.yaml, ...) should trigger a release, not just rockcraft.yaml.
          # The glob is restricted to major.minor(.patch) folders so changes in
          # non-version folders (e.g. .github/, tests/, docs/) are ignored.
          files: "[0-9]*\\.[0-9]*/**"
      - name: Extract the versions
        id: changed-versions
        env:
          # CHANGED_FILES is a space-separated list of paths relative to rock-path
          CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
        run: |
          versions=""
          for f in $CHANGED_FILES; do
            version="${f%%/*}"  # top-level folder of the changed file, i.e. the version
            case " $versions " in
              *" $version "*) ;;  # already collected
              *) versions="$versions $version" ;;
            esac
          done
          versions="${versions# }"  # space-separated versions
          echo "versions=$versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: steps.changed-files.outputs.all_changed_and_modified_files != ''
        run: |
          sudo snap install concierge --classic
          cat > concierge.yaml << EOF
          juju:
            disable: true
          providers:
            lxd:
              enable: true
          host:
            packages:
              - gnome-keyring
              - python3-pip
              - python3-venv
            snaps:
              charmcraft:
              jq:
              yq:
              rockcraft:
                channel: latest/edge
              snapcraft:
              just:
          EOF
          sudo concierge prepare -c concierge.yaml
          sudo snap install astral-uv --classic  # used to run noctua
      - name: Pack the rocks
        if: steps.changed-files.outputs.all_changed_and_modified_files != ''
        env:
          versions: ${{ steps.changed-versions.outputs.versions }}
        run: |
          cd "${{ inputs.rock-path }}"
          for version in $versions; do
            just pack "$version"
          done
      - name: Release to OCI Factory
        if: steps.changed-files.outputs.all_changed_and_modified_files != ''
        env:
          GITHUB_TOKEN: ${{ secrets.OBSERVABILITY_NOCTUA_TOKEN }}
          versions: ${{ steps.changed-versions.outputs.versions }}
        run: |
          cd "${{ inputs.rock-path }}"
          for version in $versions; do
            echo "Releasing version $version to OCI Factory on track ${{ inputs.risk-track }}"
            just release-oci-factory "$version" ${{ inputs.rock-support }} ${{ inputs.risk-track }}
          done
