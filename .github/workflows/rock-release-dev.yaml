name: Build rock and release dev tag to GHCR

on:
  workflow_call:
    inputs:
      rock-path:
        description: "Optional path to the rock(s) directory to operate in"
        required: false
        default: "."
        type: string
    secrets:
      OBSERVABILITY_NOCTUA_TOKEN:
        required: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v6
    - name: Install dependencies
      run: |
        sudo snap install concierge --classic
        cat > concierge.yaml << EOF
        juju:
          disable: true
        providers:
          lxd:
            enable: true
        host:
          packages:
            - gnome-keyring
            - python3-pip
            - python3-venv
          snaps:
            charmcraft:
            jq:
            yq:
            rockcraft:
              channel: latest/edge
            snapcraft:
            just:
            syft:
        EOF
        sudo concierge prepare -c concierge.yaml
    - name: Work around AppArmor unprivileged userns restriction
      # Newer ubuntu-24.04 runner images enforce AppArmor mediation of
      # unprivileged user namespaces, which breaks LXD-based builds.
      # See https://github.com/canonical/concierge/issues/253
      run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
    - name: Build rock and release to GHCR
      id: build-and-release
      env:
        GITHUB_TOKEN: ${{ secrets.OBSERVABILITY_NOCTUA_TOKEN }}
      run: |
        cd "${{ inputs.rock-path }}"
        echo "latest_version=$(just latest-version)" >> "$GITHUB_ENV"
        just pack
        just release-ghcr
    - name: Create SBOM
      id: create-sbom
      run: |
        cd "${{ inputs.rock-path }}"
        just sbom
        echo rock_name="$(just name)" >> "$GITHUB_OUTPUT"
    - name: Upload SBOM
      uses: actions/upload-artifact@v6
      with:
        name: ${{ steps.create-sbom.outputs.rock_name }}-rock-sbom
        path: "${{ inputs.rock-path }}/${{ steps.build-and-release.outputs.latest_version }}/rock.sbom.json"
    - name: Upload locally built rock artifact
      uses: actions/upload-artifact@v6
      with:
        name: dev.rock
        path: "${{ inputs.rock-path }}/${{ steps.build-and-release.outputs.latest_version }}/*.rock"
