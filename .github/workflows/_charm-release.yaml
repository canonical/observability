name: Release charm to Edge

on:
  workflow_call:
    inputs:
      release-channel:
        description: |
          Name of the Charmhub channel (with the format 'latest/edge') to release the charm to.
        type: string
        required: true
      charm-path:
        type: string
        required: false
        default: .
      runners:
        description: |
          Json matrix of the runners to use to build and release the charm.
          Example: ["ubuntu-latest","Ubuntu_ARM64_4C_16G_03"]
          Ignored when `pack-using-remote-build` is true; in that case the
          matrix is derived from `.platforms` in `charmcraft.yaml`.
        type: string
        required: false
        default: '["ubuntu-latest"]'
      charmcraft-channel:
        type: string
        required: true
        description: |
          The snap channel from which to install Charmcraft.
      git-tag-prefix:
        description: "Tag prefix to use for the tag of the GitHub release."
        required: false
        type: string
      pack-using-remote-build:
        description: |
          When packing the charm for release, use remote-build.
          Remote-building is useful when you want to pack and release a charm for archs such as S390x or PPC64EL.
        default: false
        required: false
        type: boolean
    secrets:
      CHARMHUB_TOKEN:
        required: true
      LAUNCHPAD_TOKEN:
        required: false
      OBSERVABILITY_NOCTUA_TOKEN:
        required: true

jobs:
  define-matrix:
    name: Define build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install dependencies
        run: sudo snap install yq
      - name: Define build matrix
        id: build-matrix
        env:
          CHARM_PATH: ${{ inputs.charm-path }}
          PACK_REMOTE: ${{ inputs.pack-using-remote-build }}
          RUNNERS: ${{ inputs.runners }}
        run: |
          if [[ "$PACK_REMOTE" == "true" ]]; then
            # Fan out one matrix leg per `platforms:` entry in charmcraft.yaml,
            # all on ubuntu-latest (the actual build happens on Launchpad).
            # `charmcraft` has no --build-for flag, so each leg later strips
            # charmcraft.yaml down to just its `platform` before packing.
            matrix="$(
              yq -o=json -I=0 '.platforms | keys' "$CHARM_PATH/charmcraft.yaml" \
                | jq -c '{"include": map({"runner": "ubuntu-latest", "platform": .})}'
            )"
          else
            # Local build: preserve the previous behavior of one leg per
            # caller-supplied runner, with no per-platform filtering.
            matrix="$(echo "$RUNNERS" | jq -c '{"include": map({"runner": ., "platform": ""})}')"
          fi
          echo "matrix=$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: Release the charm${{ matrix.platform && format(' ({0})', matrix.platform) || '' }}
    needs: [define-matrix]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      # Launchpad remote-build uses a shared git repo per charm, so parallel
      # builds for different architectures race and fail. Serialize when
      # remote-building; local builds fan out across distinct runners so the
      # high cap is effectively "no limit".
      max-parallel: ${{ inputs.pack-using-remote-build && 1 || 256 }}
      matrix: ${{ fromJSON(needs.define-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install dependencies
        env:
          CONCIERGE_CHARMCRAFT_CHANNEL: ${{ inputs.charmcraft-channel }}
          CONCIERGE_EXTRA_SNAPS: "astral-uv,yq"
          # The self-hosted arm64 runner tracks an older LXD channel that can't
          # pack the 26.04 base; pin to latest/stable to refresh onto the fix.
          CONCIERGE_LXD_CHANNEL: latest/stable
        run: |
          sudo snap install concierge --classic
          sudo -E concierge prepare -p crafts
      - name: Get charm name
        id: get-charm-name
        run: |
          # Read charm name from metadata.yaml or charmcraft.yaml
          cd "${{ inputs.charm-path }}"
          charm_name=$(yq .name metadata.yaml 2>/dev/null || yq .name charmcraft.yaml)
          echo "charm_name=$charm_name" >> "$GITHUB_OUTPUT"
      - name: Cache wheels
        uses: actions/cache@v5
        with:
          path: /home/runner/snap/charmcraft/common/cache/charmcraft
          key: ${{ runner.os }}-wheel-cache-${{ hashFiles('./uv.lock') }}
          # If the above cache key doesn't match, it's because the uv.lock has changed.
          # Even so, pre-existing caches may still contain useful cached builds for some
          # portion of the dependencies, and restore-keys can partially match a cache.
          restore-keys: |
            ${{ runner.os }}-wheel-cache-
      - name: Pack charm(s) locally
        if: ${{ !inputs.pack-using-remote-build }}
        run: |
          cd "${{ inputs.charm-path }}"
          charmcraft pack -v
          charms="$(basename -a ./*.charm | jq -R -s -c 'split("\n")[:-1]')"
          echo "charms=$charms"
          echo "charms=$charms" >> "$GITHUB_OUTPUT"
      - name: Pack charm(s) using remote-build
        if: ${{ inputs.pack-using-remote-build }}
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          LAUNCHPAD_TOKEN: ${{ secrets.LAUNCHPAD_TOKEN }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd "${{ inputs.charm-path }}"
          # Set up Launchpad credentials for remote-build
          mkdir -p ~/.local/share/charmcraft
          printf '%s\n' "${LAUNCHPAD_TOKEN}" > ~/.local/share/charmcraft/launchpad-credentials
          chmod 600 ~/.local/share/charmcraft/launchpad-credentials
          # `charmcraft` has no --build-for flag, so strip charmcraft.yaml down
          # to just this matrix leg's platform before packing.
          yq -i '.platforms |= with_entries(select(.key == strenv(PLATFORM)))' charmcraft.yaml
          charmcraft remote-build --launchpad-accept-public-upload
          # Set output with list of built charms
          charms="$(basename -a ./*.charm | jq -R -s -c 'split("\n")[:-1]')"
          echo "charms=$charms"
          echo "charms=$charms" >> "$GITHUB_OUTPUT"
      - name: Compute artifact name
        id: artifact-name
        env:
          PLATFORM: ${{ matrix.platform }}
          RUNNER_ARCH: ${{ runner.arch }}
          CHARM_PATH: ${{ inputs.charm-path }}
        run: |
          # GitHub artifact names cannot contain any of :"/\<>|*? (NTFS-unsafe).
          # For remote-build legs the matrix carries the charmcraft platform key
          # (e.g. `ubuntu@20.04:amd64`), which contains a forbidden `:`. Replace
          # every forbidden character with `-` so the artifact upload succeeds
          # while still keeping the platform identifiable in the artifact name.
          if [[ -n "$PLATFORM" ]]; then
            suffix="$(printf '%s' "$PLATFORM" | tr ':"/\\<>|*?' '-')"
          else
            suffix="$RUNNER_ARCH"
          fi
          echo "suffix=$suffix"
          echo "suffix=$suffix" >> "$GITHUB_OUTPUT"
          # Sanitize charm-path for use in the artifact name (slashes are
          # forbidden in artifact names).
          if [[ -n "$CHARM_PATH" && "$CHARM_PATH" != "." ]]; then
            sanitized_path="$(printf '%s' "$CHARM_PATH" | tr '/' '-')"
          else
            sanitized_path=""
          fi
          echo "charm-path=$sanitized_path"
          echo "charm-path=$sanitized_path" >> "$GITHUB_OUTPUT"
      - name: Store charm(s)
        uses: actions/upload-artifact@v6
        with:
          # For local builds keep the historic `runner.arch` suffix; for remote
          # builds use `matrix.platform` so parallel legs (all on ubuntu-latest)
          # don't overwrite each other's artifact. GitHub artifact names cannot
          # contain `:` (and a few other chars), so `matrix.platform` values
          # like `ubuntu@20.04:amd64` are sanitized in `Compute artifact name`.
          name: charms-${{ steps.artifact-name.outputs.suffix }}${{ steps.artifact-name.outputs.charm-path && format('-{0}', steps.artifact-name.outputs.charm-path) || '' }}
          path: ${{ inputs.charm-path }}/*.charm
      - name: Release charm to Charmhub and GitHub
        id: upload
        env:
          CHARMCRAFT_AUTH: ${{ secrets.CHARMHUB_TOKEN }}
          CHARM_NAME: ${{ steps.get-charm-name.outputs.charm_name }}
          GH_TOKEN: ${{ secrets.OBSERVABILITY_NOCTUA_TOKEN }}
          TAG_PREFIX: ${{ inputs.git-tag-prefix }}
          RELEASE_CHANNEL: ${{ inputs.release-channel }}
        run: |
          # Upload charm to CharmHub and release it
          # uploaded_charm has the following JSON format:
          # {"name": "o11y-tester", "revision": 12, "resources": [
          #   {"name": "httpbin-image", "revision": 1, "upstream_source": "kennethreitz/httpbin"}
          # ]}
          set -x
          cd "${{ inputs.charm-path }}"
          file_paths="$(find . -name '*.charm' -printf '%f ')"
          # Write noctua's JSON output to a temp file outside the repo tree.
          # The charm dir is not reliably writable on persistent self-hosted
          # runners, and a dropfile in the checkout can also be clobbered by
          # leftover root-owned state across runs.
          upload_results="$(mktemp)"
          # For all the charms built on this architecture: release them
          for path in ${file_paths}; do
            uvx --quiet --from git+https://github.com/lucabello/noctua noctua charm release \
              "$CHARM_NAME" \
              --path "$path" \
              --channel "$RELEASE_CHANNEL" \
              --json > "$upload_results"
            uploaded_charm="$(jq -rc . "$upload_results")"
            pretty_uploaded_charm="$(jq -r . "$upload_results")"
            rm -f "$upload_results"
            ubuntu_base="$(find . -name '*.charm' | sed -E 's/.*ubuntu@([0-9]{2}\.[0-9]{2})-(.+)\.charm/ubuntu@\1 (\2)/')"
            echo "${CHARM_NAME} has been released to ${RELEASE_CHANNEL}:"
            echo "$pretty_uploaded_charm"
            # Create a git tag and push it
            ## Configure git with Noctua identity
            git config --global user.email "webops+observability-noctua-bot@canonical.com"
            git config --global user.name "Noctua"
            ## Configure git to use the Noctua token for push
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
            ## Use the latest commit message as the tag message
            git log -1 --pretty=%B > tag-message
            revision="$(echo "$uploaded_charm" | jq -rc .revision)"
            git tag --annotate "${TAG_PREFIX}rev${revision}" --file=tag-message
            rm -f tag-message
            git push origin --tags
            # Create a GitHub release 
            release_title="Revision $revision"
            echo "Preparing GitHub release: $release_title"
            ## Add the charm information to the release body
            body_charm="$(printf "\`\`\`json\n%s\n\`\`\`" "$pretty_uploaded_charm")"
            current_date="$(date -u +"%B %e, %Y at %H:%M UTC")"
            body_meta_base="$(printf "This revision is for *%s*" "$ubuntu_base")"
            body_meta="$(printf "Released to *%s* on %s" "$RELEASE_CHANNEL" "$current_date")"
            body="$(printf "%s\n\n%s\n%s" "$body_charm" "$body_meta_base" "$body_meta")"
            ## Create the GitHub release from the previously-created tag
            gh release create "${TAG_PREFIX}rev${revision}" \
              --title="$release_title" \
              --notes="$body" \
              --generate-notes
          done
      - name: Open SSH session on failure
        if: ${{ failure() && (runner.debug == '1') }}
        uses: mxschmitt/action-tmate@v3
        with:
          timeout-minutes: 30
          limit-access-to-actor: true
